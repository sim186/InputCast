name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/InputCast -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/${{ matrix.rid }}

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/${{ matrix.rid }}/InputCast.exe, README.md, LICENSE -DestinationPath InputCast-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: InputCast-${{ matrix.rid }}
          path: InputCast-${{ matrix.rid }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" InputCast-*.zip --repo "${{ github.repository }}" --title "InputCast ${{ github.ref_name }}" --generate-notes
